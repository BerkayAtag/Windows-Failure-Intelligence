# Template: replace DNS, addresses, and certificates before use. Single gateway limits.
events { worker_connections 4096; }
http {
    limit_req_zone $binary_remote_addr zone=wfi_login:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=wfi_connections:10m;
    upstream wfi_api {
        least_conn;
        server 10.0.10.11:443 max_fails=3 fail_timeout=10s;
        server 10.0.10.12:443 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }
    server {
        listen 443 ssl;
        server_name wfi.example.invalid;
        ssl_certificate /etc/wfi/tls/fullchain.pem;
        ssl_certificate_key /etc/wfi/tls/private.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 21m;
        client_body_timeout 30s;
        limit_conn wfi_connections 20;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host wfi.example.invalid;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_name wfi.example.invalid;
        proxy_ssl_trusted_certificate /etc/wfi/tls/corporate-ca-chain.pem;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 4;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        location = /api/v1/auth/login {
            limit_req zone=wfi_login burst=3 nodelay;
            limit_req_status 429;
            proxy_pass https://wfi_api;
        }
        location / { proxy_pass https://wfi_api; }
    }
}
