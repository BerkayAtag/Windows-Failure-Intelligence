name: Preview installers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', 'deploy/**', 'Directory.Build.props', '.github/workflows/preview-release.yml']
permissions:
  contents: write
concurrency:
  group: preview-release
  cancel-in-progress: false
jobs:
  installers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11'
      - name: Build and regression tests
        shell: pwsh
        run: ./scripts/Build.ps1
      - name: Package
        shell: pwsh
        run: |
          ./scripts/Package.ps1

          $paths=@('artifacts/WFI-Server-Setup.exe','artifacts/WFI-0.6.0-preview.4-pilot.zip')
          $paths | ForEach-Object { $hash=Get-FileHash -LiteralPath $_ -Algorithm SHA256; "$($hash.Hash.ToLowerInvariant())  $(Split-Path $_ -Leaf)" } | Set-Content artifacts/SHA256SUMS.txt
      - name: Publish development preview
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.6.0-preview.4 --json tagName *> $null
          if($LASTEXITCODE -ne 0) {
            gh release create v0.6.0-preview.4 --target '${{ github.sha }}' --prerelease --title 'WFI 0.6.0-preview.4' --notes-file docs/release-preview.md
            if($LASTEXITCODE -ne 0){throw 'Release creation failed'}
          }
          gh release upload v0.6.0-preview.4 artifacts/WFI-Server-Setup.exe artifacts/WFI-0.6.0-preview.4-pilot.zip artifacts/SHA256SUMS.txt --clobber
          if($LASTEXITCODE -ne 0){throw 'Release upload failed'}
