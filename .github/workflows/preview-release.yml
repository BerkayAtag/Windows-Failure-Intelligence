name: Release installers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', 'deploy/**', 'Directory.Build.props', '.github/workflows/preview-release.yml']
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
env:
  WFI_VERSION: '0.7.0'
jobs:
  installers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11'
      - name: Build and regression tests
        shell: pwsh
        run: ./scripts/Build.ps1
      - name: Checksums
        shell: pwsh
        run: |
          $hash=Get-FileHash -LiteralPath artifacts/WFI-Server-Setup.exe -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  WFI-Server-Setup.exe" | Set-Content artifacts/SHA256SUMS.txt
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag="v$env:WFI_VERSION"
          gh release view $tag --json tagName *> $null
          if($LASTEXITCODE -ne 0) {
            gh release create $tag --target '${{ github.sha }}' --latest --title "WFI $env:WFI_VERSION" --notes-file docs/release-preview.md
            if($LASTEXITCODE -ne 0){throw 'Release creation failed'}
          }
          $tagCommit=gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha'
          if($LASTEXITCODE -ne 0 -or $tagCommit.Trim() -ne $env:GITHUB_SHA){throw 'Release tag differs from build commit. Increment the version; never replace assets from another commit.'}
          # Only the server setup is published; the client agent is downloaded from the authenticated WFI console.
          gh release upload $tag artifacts/WFI-Server-Setup.exe artifacts/SHA256SUMS.txt --clobber
          if($LASTEXITCODE -ne 0){throw 'Release upload failed'}
